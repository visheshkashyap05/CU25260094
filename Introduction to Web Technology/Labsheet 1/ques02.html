<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Formatting Tags</title>
</head>
<body>
    <!-- Question 2: Demonstrate headings and text-formatting tags. -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <p><b>Bold text using b tag</b></p>
    <p><strong>Important text using strong tag</strong></p>
    <p><i>Italic text using i tag</i></p>
    <p><em>Emphasized text using em tag</em></p>
    <p><u>Underlined text using u tag</u></p>
    <p><mark>Highlighted text using mark tag</mark></p>
    <p>Water formula: H<sub>2</sub>O</p>
    <p>Mathematical expression: x<sup>2</sup> + y<sup>2</sup></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Programming Languages</title>
</head>
<body>
    <!-- Question 3: Display five programming languages using an unordered list. -->
    <h1>Programming Languages</h1>

    <h2>Disc Style</h2>
    <ul style="list-style-type: disc;">
        <li>C</li>
        <li>C++</li>
        <li>Java</li>
        <li>Python</li>
        <li>JavaScript</li>
    </ul>

    <h2>Circle Style</h2>
    <ul style="list-style-type: circle;">
        <li>C</li>
        <li>C++</li>
        <li>Java</li>
        <li>Python</li>
        <li>JavaScript</li>
    </ul>

    <h2>Square Style</h2>
    <ul style="list-style-type: square;">
        <li>C</li>
        <li>C++</li>
        <li>Java</li>
        <li>Python</li>
        <li>JavaScript</li>
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; }
        form { width: 450px; padding: 20px; border: 1px solid #444; }
        label { display: inline-block; width: 130px; margin-bottom: 10px; }
        input, select, textarea { margin-bottom: 10px; }
    </style>
</head>
<body>
    <!-- Question 9: Create a Student Registration Form. -->
    <h1>Student Registration Form</h1>

    <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br>

        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br>

        <label for="course">Course:</label>
        <select id="course" name="course">
            <option>BCA</option>
            <option>B.Tech</option>
            <option>BBA</option>
            <option>MCA</option>
        </select><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobby" value="Coding"> Coding
        <input type="checkbox" name="hobby" value="Reading"> Reading
        <input type="checkbox" name="hobby" value="Sports"> Sports<br>

        <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="30"></textarea><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
